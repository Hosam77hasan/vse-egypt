name: "\U0001F3D7\uFE0F Build VS Code Egypt Installer"

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (must already exist as a git tag or release)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: "\U0001FA9A Windows Installer (.exe + .msi)"
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-win32-x64-1.126.04524.zip" -OutFile vscodium.zip
          Expand-Archive -Path vscodium.zip -DestinationPath vscode-egypt

      - name: Apply VS Code Egypt branding
        shell: pwsh
        run: |
          $app = "vscode-egypt"
          $productJson = Get-ChildItem $app -Recurse -Filter "product.json" | Select-Object -First 1
          $pj = Get-Content $productJson.FullName -Raw | ConvertFrom-Json

          # Branding
          $pj.nameShort = "VSCodeEgypt"
          $pj.nameLong = "VS Code Egypt"
          $pj.win32DirName = "VS Code Egypt"
          $pj.win32NameVersion = "VS Code Egypt"
          $pj.win32RegValueName = "VSCodeEgypt"
          $pj.win32ShellNameShort = "VS Code Egypt"
          $pj.win32AppUserModelId = "VSCodeEgypt.VSCodeEgypt"
          $pj.win32MutexName = "vscodeegypt"
          $pj.applicationName = "vscode-egypt"
          $pj.dataFolderName = ".vscode-egypt"
          $pj.urlProtocol = "vscode-egypt"
          $pj.darwinBundleIdentifier = "com.vscodeegypt.app"
          $pj.linuxIconName = "vscode-egypt"

          # Default settings
          $defaults = @{
              "security.workspace.trust.enabled" = $false
              "security.workspace.trust.startupPrompt" = "never"
              "security.workspace.trust.banner" = "never"
              "security.workspace.trust.emptyWindow" = $false
              "workbench.colorTheme" = "VS Code Egypt Lime"
              "workbench.activityBar.visible" = $true
              "workbench.sideBar.location" = "left"
              "extensions.ignoreRecommendations" = $false
              "extensions.autoUpdate" = $true
              "workbench.startupEditor" = "none"
              "workbench.enableExperiments" = $false
              "telemetry.telemetryLevel" = "off"
              "update.mode" = "none"
              "chat.enabled" = $false
              "github.copilot.enable" = @{}
              "editor.inlineSuggest.enabled" = $false
          }
          $pj | Add-Member -MemberType NoteProperty -Name 'configurationDefaults' -Value $defaults -Force -ErrorAction SilentlyContinue

          # Built-in extensions
          $pj | Add-Member -MemberType NoteProperty -Name 'builtInExtensions' -Value @(@{ name = "vscode-egypt-theme"; publisher = "vscode-egypt"; version = "1.0.0" }) -Force

          # AI blocklist
          $blocklist = @(
              "github.copilot", "github.copilot-chat", "tabnine.tabnine-vscode",
              "codeium.codeium", "amazonwebservices.amazon-q-vscode", "continue.continue",
              "sourcegraph.cody-ai", "google.geminicodeassist", "saoudrizwan.claude-dev",
              "kodu-ai.claude-coder", "anthropic.claude-code", "cursor.cursor"
          )
          $pj | Add-Member -MemberType NoteProperty -Name 'extensionAiBlocklist' -Value $blocklist -Force

          $pj | ConvertTo-Json -Depth 100 | Out-File -FilePath $productJson.FullName -Encoding utf8
          Write-Host "Branded: product.json"

          # Rename EXE
          $exe = Get-ChildItem $app -Recurse -Include "VSCodium.exe","codium.exe" |
              Where-Object { $_.DirectoryName -notmatch '\\bin[\\$]' } |
              Sort-Object Length -Descending |
              Select-Object -First 1

          if ($exe) {
            Rename-Item $exe.FullName "VS Code Egypt.exe" -ErrorAction Stop
            Write-Host "Renamed: $($exe.Name) -> VS Code Egypt.exe"
          } else {
            Write-Host "FATAL: No main executable found!"
            exit 1
          }

          # Flatten
          $exeAfter = Get-ChildItem $app -Recurse -Filter "VS Code Egypt.exe" | Select-Object -First 1
          if ($exeAfter) {
            $nestedDir = Split-Path $exeAfter.FullName -Parent
            $appRoot = (Resolve-Path $app).Path
            if ($nestedDir -ne $appRoot) {
              Get-ChildItem $nestedDir | Move-Item -Destination $app -Force
              Remove-Item $nestedDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "EXE ready at root"

      - name: Copy icon and theme
        shell: pwsh
        run: |
          $appDir = "vscode-egypt"
          
          # Copy icon
          $iconSource = "vse-config\resources\win32\kliopatra.ico"
          if (Test-Path $iconSource) {
            Copy-Item $iconSource "$appDir\kliopatra.ico" -Force
            Write-Host "Icon copied"
          } else {
            $pngSource = "vse-config\vse-landing\public\assets\kliopatra.png"
            if (Test-Path $pngSource) {
              Copy-Item $pngSource "$appDir\kliopatra.ico" -Force
              Write-Host "PNG copied as icon fallback"
            }
          }

          # Copy theme extension
          $themeSrc = "vse-config\extensions\vscode-egypt-theme"
          $themeDest = "$appDir\resources\app\extensions\vscode-egypt-theme"
          if (Test-Path $themeSrc) {
            $destDir = Split-Path $themeDest -Parent
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            Copy-Item $themeSrc $themeDest -Recurse -Force
            Write-Host "Theme copied"
          }

          # Copy AI extension
          $aiExtSrc = "vse-config\vse-extension\editor"
          $aiExtDest = "$appDir\resources\app\extensions\vse-egypt-ai"
          if (Test-Path $aiExtSrc) {
            $destDir = Split-Path $aiExtDest -Parent
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            Copy-Item $aiExtSrc $aiExtDest -Recurse -Force
            Write-Host "AI extension copied"
          }

          # Copy fix-shortcut.ps1
          Copy-Item "vse-config\scripts\fix-shortcut.ps1" "$appDir\fix_shortcut.ps1" -Force -ErrorAction SilentlyContinue

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Emperor Software Development, O=Emperor Software Development, L=Cairo, C=EG" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)

          $pwd = ConvertTo-SecureString -String "vse-build-temp" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "vse-code-selfsign.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "vse-code-signing.cer" -Type CERT | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          Copy-Item "vse-code-signing.cer" "vscode-egypt\vse-code-signing.cer" -Force
          Write-Host "Certificate ready"

      - name: Build with Inno Setup
        shell: pwsh
        run: |
          $appDir = Join-Path $env:GITHUB_WORKSPACE "vscode-egypt"
          
          # Find ISCC.exe
          $iscc = $null
          foreach ($p in @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe")) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) { Write-Host "ERROR: ISCC.exe not found"; exit 1 }
          Write-Host "ISCC: $iscc"
          
          # Generate ISS file using Python (avoids all PowerShell quoting issues)
          python3 vse-config/scripts/gen_iss.py $appDir
          
          if (-not (Test-Path "setup.iss")) {
            Write-Host "ERROR: setup.iss not generated"
            exit 1
          }
          Write-Host "ISS file generated"
          Get-Content setup.iss | Select-Object -First 10
          
          # Create Output directory
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null
          
          # Run ISCC
          & $iscc setup.iss
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ISCC FAILED with exit code $LASTEXITCODE"
            exit 1
          }
          
          # Check output
          if (Test-Path "Output\VS-Code-Egypt-Setup.exe") {
            Copy-Item "Output\VS-Code-Egypt-Setup.exe" .
            $size = (Get-Item "VS-Code-Egypt-Setup.exe").Length
            Write-Host "EXE CREATED: VS-Code-Egypt-Setup.exe ($size bytes)"
          } else {
            Write-Host "EXE FAILED"
            Get-ChildItem Output -ErrorAction SilentlyContinue
            exit 1
          }

            "AppId={{VSCODEEGYPT-INSTALLER-GUID-REPLACE-ME}}`r`n" +
            "AppName=VS Code Egypt`r`n" +
            "AppVersion=1.1.0`r`n" +
            "AppPublisher=Emperor Software Development`r`n" +
            "DefaultDirName={autopf}\VS Code Egypt`r`n" +
            "DefaultGroupName=VS Code Egypt`r`n" +
            "OutputDir=Output`r`n" +
            "OutputBaseFilename=VS-Code-Egypt-Setup`r`n" +
            "Compression=lzma2`r`n" +
            "SolidCompression=yes`r`n" +
            "ArchitecturesAllowed=x64`r`n" +
            "ArchitecturesInstallIn64BitMode=x64`r`n" +
            "SetupIconFile=$iconFile`r`n" +
            "PrivilegesRequired=lowest`r`n" +
            "DisableDirPage=no`r`n" +
            "DirExistsWarning=yes`r`n" +
            "Uninstallable=yes`r`n" +
            "CreateUninstallRegKey=yes`r`n" +
            "UninstallDisplayName=VS Code Egypt`r`n" +
            "UninstallDisplayIcon={app}\kliopatra.ico`r`n" +
            "`r`n" +
            "[Languages]`r`n" +
            "Name: ""english""; MessagesFile: ""compiler:Default.isl""`r`n" +
            "`r`n" +
            "[Tasks]`r`n" +
            "Name: ""desktopicon""; Description: ""Create a desktop icon""; GroupDescription: ""Additional icons:""`r`n" +
            "`r`n" +
            "[Files]`r`n" +
            "Source: ""$appDir\*""; DestDir: ""{app}""; Flags: ignoreversion recursesubdirs createallsubdirs`r`n" +
            "`r`n" +
            "[Icons]`r`n" +
            "Name: ""{userdesktop}\VS Code Egypt""; Filename: ""{app}\VS Code Egypt.exe""; IconFilename: ""{app}\kliopatra.ico""; WorkingDir: ""{app}""; Tasks: desktopicon`r`n" +
            "Name: ""{group}\VS Code Egypt""; Filename: ""{app}\VS Code Egypt.exe""; IconFilename: ""{app}\kliopatra.ico""; WorkingDir: ""{app}""`r`n" +
            "Name: ""{group}\Uninstall VS Code Egypt""; Filename: ""{uninstallexe}""`r`n" +
            "`r`n" +
            "[Registry]`r`n" +
            "Root: HKCR; Subkey: ""vscode-egypt""; ValueType: string; ValueName: """"; ValueData: ""URL:VS Code Egypt Protocol""; Flags: uninsdeletekey`r`n" +
            "Root: HKCR; Subkey: ""vscode-egypt""; ValueType: string; ValueName: ""URL Protocol""; ValueData: """"`r`n" +
            "Root: HKCR; Subkey: ""vscode-egypt\shell\open\command""; ValueType: string; ValueName: """"; ValueData: """"""{app}\VS Code Egypt.exe"""" """"%1""""""`r`n" +
            "`r`n" +
            "[Run]`r`n" +
            "Filename: ""{app}\VS Code Egypt.exe""; WorkingDir: ""{app}""; Description: ""Launch VS Code Egypt""; Flags: postinstall nowait skipifsilent`r`n"
          
          # Write using .NET to avoid encoding issues
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "setup.iss"),
            $issContent,
            [System.Text.Encoding]::ASCII
          )
          Write-Host "ISS file written"
          Get-Content (Join-Path $env:GITHUB_WORKSPACE "setup.iss") | Select-Object -First 15
          
          # Create Output directory
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null
          
          # Run ISCC
          & $iscc (Join-Path $env:GITHUB_WORKSPACE "setup.iss")
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ISCC FAILED with exit code $LASTEXITCODE"
            Write-Host "Full ISS file:"
            Get-Content (Join-Path $env:GITHUB_WORKSPACE "setup.iss")
            exit 1
          }
          
          # Check output
          $outExe = Join-Path $env:GITHUB_WORKSPACE "Output\VS-Code-Egypt-Setup.exe"
          if (Test-Path $outExe) {
            Copy-Item $outExe (Join-Path $env:GITHUB_WORKSPACE "VS-Code-Egypt-Setup.exe") -Force
            $size = (Get-Item (Join-Path $env:GITHUB_WORKSPACE "VS-Code-Egypt-Setup.exe")).Length
            Write-Host "EXE CREATED: VS-Code-Egypt-Setup.exe ($size bytes)"
          } else {
            Write-Host "EXE FAILED - Output folder:"
            Get-ChildItem Output -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
            exit 1
          }

      - name: Build MSI (optional)
        shell: pwsh
        continue-on-error: true
        run: |
          $wixCandle = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin\candle.exe"
          $wixLight = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin\light.exe"
          if (-not (Test-Path $wixCandle)) {
            Write-Host "WiX not installed — skipping MSI"
            exit 1
          }

          $wxs = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="VS Code Egypt" Language="1033" Version="1.1.0"
                     Manufacturer="Emperor Software Development"
                     UpgradeCode="8F7A2B3C-4D5E-6F7A-8B9C-0D1E2F3A4B5C">
              <Package InstallerVersion="300" Compressed="yes" InstallScope="perMachine" Platform="x64" />
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="VS Code Egypt" Level="1">
                <ComponentGroupRef Id="AppFiles" />
              </Feature>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLDIR" Name="VS Code Egypt" />
                </Directory>
                <Directory Id="DesktopFolder" />
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="AppProgramMenuFolder" Name="VS Code Egypt" />
                </Directory>
              </Directory>
              <ComponentGroup Id="AppFiles" Directory="INSTALLDIR">
                <Component Id="MainExe" Guid="*">
                  <File Id="MainExeFile" Name="VS Code Egypt.exe" Source="vscode-egypt\VS Code Egypt.exe" KeyPath="yes" />
                </Component>
              </ComponentGroup>
              <Property Id="WIXUI_INSTALLDIR" Value="INSTALLDIR" />
              <UIRef Id="WixUI_InstallDir" />
            </Product>
          </Wix>
          "@
          Set-Content -Path "setup.wxs" -Value $wxs

          $wixObj = "$env:TEMP\VSCodeEgypt.wixobj"
          & $wixCandle -arch x64 -out "$wixObj" setup.wxs
          if ($LASTEXITCODE -eq 0) {
            & $wixLight -out "VS-Code-Egypt-Setup.msi" "$wixObj"
            Remove-Item "$wixObj" -Force -ErrorAction SilentlyContinue
            Write-Host "MSI CREATED"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-Setup-exe
          path: |
            VS-Code-Egypt-Setup.exe
            VS-Code-Egypt-Setup.msi

  build-macos:
    name: "\U0001F34E macOS .dmg"
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        run: |
          curl -L -o vscodium.zip "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-darwin-arm64-1.126.04524.zip"
          unzip -q vscodium.zip -d vscode-egypt

      - name: Apply branding
        run: |
          PRODUCT_JSON=$(find vscode-egypt -name "product.json" -type f | head -1)
          
          python3 << 'PYEOF'
          import json, os
          
          product_json = os.popen('find vscode-egypt -name "product.json" -type f | head -1').read().strip()
          with open(product_json, 'r') as f:
              pj = json.load(f)
          
          pj['nameShort'] = 'VSCodeEgypt'
          pj['nameLong'] = 'VS Code Egypt'
          pj['applicationName'] = 'vscode-egypt'
          pj['dataFolderName'] = '.vscode-egypt'
          pj['darwinBundleIdentifier'] = 'com.vscodeegypt.app'
          pj['linuxIconName'] = 'vscode-egypt'
          pj['urlProtocol'] = 'vscode-egypt'
          
          pj['configurationDefaults'] = {
              'workbench.colorTheme': 'VS Code Egypt Lime',
              'security.workspace.trust.enabled': False,
              'security.workspace.trust.startupPrompt': 'never',
              'security.workspace.trust.banner': 'never',
              'security.workspace.trust.emptyWindow': False,
              'workbench.activityBar.visible': True,
              'workbench.sideBar.location': 'left',
              'workbench.startupEditor': 'none',
              'workbench.enableExperiments': False,
              'telemetry.telemetryLevel': 'off',
              'update.mode': 'none',
              'extensions.ignoreRecommendations': False,
              'extensions.autoUpdate': True,
          }
          
          pj['builtInExtensions'] = [
              {'name': 'vscode-egypt-theme', 'publisher': 'vscode-egypt', 'version': '1.0.0'}
          ]
          
          try:
              with open('vse-config/product.json', 'r') as f:
                  src_pj = json.load(f)
              pj['extensionAiBlocklist'] = src_pj.get('extensionAiBlocklist', [])
          except:
              pj['extensionAiBlocklist'] = []
          
          pj['vscodeEgyptLicenseApiBaseUrl'] = 'https://vse-egypt-production.up.railway.app/v1'
          
          with open(product_json, 'w') as f:
              json.dump(pj, f, indent=2)
          
          print(f'Branded: {len(pj)} fields')
          PYEOF
          
          # Copy theme extension
          THEME_SRC="vse-config/extensions/vscode-egypt-theme"
          THEME_DEST=$(find vscode-egypt -path "*/resources/app/extensions" -type d | head -1)
          if [ -n "$THEME_DEST" ] && [ -d "$THEME_SRC" ]; then
            cp -R "$THEME_SRC" "$THEME_DEST/vscode-egypt-theme"
          fi

      - name: Create DMG
        run: |
          APP=$(find vscode-egypt -name "*.app" -type d -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find vscode-egypt -type d -maxdepth 3
            exit 1
          fi
          echo "APP: $APP"
          mkdir -p dmg-root
          cp -R "$APP" dmg-root/
          hdiutil create -volname "VS Code Egypt" -srcfolder dmg-root -ov -format UDZO VS-Code-Egypt.dmg
          ls -lh VS-Code-Egypt.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-DMG
          path: VS-Code-Egypt.dmg

  release:
    name: "\U0001F680 Release"
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-Setup-exe }
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-DMG }

      - name: Generate checksums
        run: |
          sha256sum VS-Code-Egypt-Setup.exe > VS-Code-Egypt-Setup.exe.sha256 || true
          sha256sum VS-Code-Egypt-Setup.msi > VS-Code-Egypt-Setup.msi.sha256 || true
          sha256sum VS-Code-Egypt.dmg > VS-Code-Egypt.dmg.sha256 || true
          cat *.sha256

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          make_latest: true
          name: "VS Code Egypt ${{ steps.tag.outputs.TAG }}"
          files: |
            VS-Code-Egypt-Setup.exe
            VS-Code-Egypt-Setup.exe.sha256
            VS-Code-Egypt-Setup.msi
            VS-Code-Egypt-Setup.msi.sha256
            VS-Code-Egypt.dmg
            VS-Code-Egypt.dmg.sha256
          body: |
            ## \U0001F3DF VS Code Egypt ${{ steps.tag.outputs.TAG }}
            
            ### \U0001F4E5:
            - \U0001FA9A **Windows (.exe)**: `VS-Code-Egypt-Setup.exe`
            - \U0001FA9A **Windows (.msi)**: `VS-Code-Egypt-Setup.msi` (SmartScreen)
            - \U0001F34E **macOS (.dmg)**: `VS-Code-Egypt.dmg`
            
            ### \u26A0\uFE0F SmartScreen:
               "More info"  "Run anyway"
            
            ### \U0001F510 SHA-256:
             `.sha256`
          token: ${{ secrets.GITHUB_TOKEN }}
