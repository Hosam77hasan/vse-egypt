name: 🏗️ Build VS Code Egypt

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-win32-x64-1.126.04524.zip" -OutFile vscodium.zip
          Expand-Archive -Path vscodium.zip -DestinationPath vscode-egypt

      - name: Apply branding
        shell: pwsh
        run: |
          $app = "vscode-egypt"
          $productJson = Get-ChildItem $app -Recurse -Filter "product.json" | Select-Object -First 1
          Copy-Item "vse-config/product.json" $productJson.FullName -Force
          $c = Get-Content $productJson.FullName -Raw
          $c = $c -replace 'VSCodium','VS Code Egypt' -replace 'vscodium','vscode-egypt'
          Set-Content $productJson.FullName -Value $c
          $exe = Get-ChildItem $app -Recurse -Filter "VSCodium.exe" | Select-Object -First 1
          if ($exe) { Rename-Item $exe.FullName "VS Code Egypt.exe" }
          Write-Host "Branded"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress 2>&1 | Select-Object -Last 3

      - name: Create Installer
        shell: pwsh
        run: |
          $appDir = (Resolve-Path "vscode-egypt").Path
          $outFile = "VS-Code-Egypt-Setup.exe"

          # Create simple NSIS script
          @"
          !include "MUI2.nsh"
          Name "VS Code Egypt"
          OutFile "$outFile"
          InstallDir "`$PROGRAMFILES64\VS Code Egypt"
          RequestExecutionLevel admin
          SetCompressor lzma

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "$appDir\*.*"
            CreateDirectory "`$SMPROGRAMS\VS Code Egypt"
            CreateShortCut "`$SMPROGRAMS\VS Code Egypt\VS Code Egypt.lnk" "`$INSTDIR\VS Code Egypt.exe"
            CreateShortCut "`$DESKTOP\VS Code Egypt.lnk" "`$INSTDIR\VS Code Egypt.exe"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
          SectionEnd

          Section "Uninstall"
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\VS Code Egypt.lnk"
            Delete "`$SMPROGRAMS\VS Code Egypt\VS Code Egypt.lnk"
            RMDir "`$SMPROGRAMS\VS Code Egypt"
          SectionEnd
          "@ | Out-File -Encoding ASCII installer.nsi

          makensis installer.nsi
          if (Test-Path $outFile) {
            Write-Host "✅ Installer: $outFile ($((Get-Item $outFile).Length) bytes)"
          } else {
            Write-Host "❌ NSIS failed, creating ZIP fallback"
            Compress-Archive -Path "$appDir\*" -DestinationPath "VS-Code-Egypt-Windows.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-Windows
          path: |
            VS-Code-Egypt-Setup.exe
            VS-Code-Egypt-Windows.zip

  build-macos:
    name: 🍎 macOS
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        run: |
          curl -L -o vscodium.zip "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-darwin-arm64-1.126.04524.zip"
          unzip -q vscodium.zip -d vscode-egypt

      - name: Apply branding
        run: |
          PRODUCT_JSON=$(find vscode-egypt -name "product.json" -type f | head -1)
          cp vse-config/product.json "$PRODUCT_JSON"
          sed -i '' 's/VSCodium/VS Code Egypt/g' "$PRODUCT_JSON"
          sed -i '' 's/vscodium/vscode-egypt/g' "$PRODUCT_JSON"
          echo "Branded"

      - name: Package
        run: zip -r VS-Code-Egypt-macOS.zip vscode-egypt/

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-macOS
          path: VS-Code-Egypt-macOS.zip

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-Windows }
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-macOS }

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "VS Code Egypt ${{ steps.tag.outputs.TAG }}"
          files: |
            VS-Code-Egypt-Windows.zip
            VS-Code-Egypt-macOS.zip
          body: |
            ## 🏛️ VS Code Egypt ${{ steps.tag.outputs.TAG }}

            ### 📥 التحميل:
            - 🪟 **Windows**: `VS-Code-Egypt-Setup.exe` — معالج تثبيت بضغطة واحدة
            - 🍎 **macOS**: `VS-Code-Egypt-macOS.zip` — فك الضغط وشغّل

            ### ✨ الميزات:
            - 🤖 3 نماذج AI: السائق (Ctrl+K)، القائد، المبتكر
            - 🚫 فلتر منع إضافات AI الخارجية
            - 🎨 تصميم Lime/Chartreuse
            - 💳 دفع يدوي (InstaPay/فودافون كاش/PayPal)

            ### 🔧 التثبيت:
            فك الضغط وشغّل. لعمل اختصار: كليك يمين على `VS Code Egypt.exe` → Send to Desktop.

            🤖 Built with Claude Code
          token: ${{ secrets.GITHUB_TOKEN }}
