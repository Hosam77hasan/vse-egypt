name: 🏗️ Build VS Code Egypt Installer

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows .exe Installer
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-win32-x64-1.126.04524.zip" -OutFile vscodium.zip
          Expand-Archive -Path vscodium.zip -DestinationPath vscode-egypt

      - name: Apply VS Code Egypt branding
        shell: pwsh
        run: |
          $app = "vscode-egypt"
          $productJson = Get-ChildItem $app -Recurse -Filter "product.json" | Select-Object -First 1
          Copy-Item "vse-config/product.json" $productJson.FullName -Force
          $c = Get-Content $productJson.FullName -Raw
          $c = $c -replace 'VSCodium','VS Code Egypt' -replace 'vscodium','vscode-egypt'
          Set-Content $productJson.FullName -Value $c
          # Rename main exe
          $exe = Get-ChildItem $app -Recurse -Filter "VSCodium.exe" | Select-Object -First 1
          if ($exe) { Rename-Item $exe.FullName "VS Code Egypt.exe" }
          Write-Host "Branded: product.json + exe renamed"

      - name: Create Inno Setup installer
        shell: cmd
        run: |
          echo === Creating Inno Setup script ===

          cat > setup.iss << 'ISSEND'
          #define MyAppName "VS Code Egypt"
          #define MyAppExeName "VS Code Egypt.exe"
          #define MySourceDir "vscode-egypt"

          [Setup]
          AppName={#MyAppName}
          AppVersion=1.0
          DefaultDirName={pf}\VS Code Egypt
          DefaultGroupName=VS Code Egypt
          OutputBaseFilename=VS-Code-Egypt-Setup
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=VS Code Egypt
          PrivilegesRequired=admin

          [Files]
          Source: "{#MySourceDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{commondesktop}\VS Code Egypt"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\VS Code Egypt"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\Uninstall VS Code Egypt"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch VS Code Egypt"; Flags: postinstall nowait skipifsilent
          ISSEND

          echo === Compiling with Inno Setup ===
          ISCC.exe setup.iss

          if exist "Output\VS-Code-Egypt-Setup.exe" (
            echo ==============================================
            echo SUCCESS: VS-Code-Egypt-Setup.exe created
            dir "Output\VS-Code-Egypt-Setup.exe"
            echo ==============================================
            copy "Output\VS-Code-Egypt-Setup.exe" .
          ) else (
            echo ERROR: Inno Setup failed to produce the installer
            dir Output\ 2>nul
            exit /b 1
          )

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-Setup-exe
          path: VS-Code-Egypt-Setup.exe

  build-macos:
    name: 🍎 macOS .dmg
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        run: |
          curl -L -o vscodium.zip "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-darwin-arm64-1.126.04524.zip"
          unzip -q vscodium.zip -d vscode-egypt

      - name: Apply branding
        run: |
          PRODUCT_JSON=$(find vscode-egypt -name "product.json" -type f | head -1)
          cp vse-config/product.json "$PRODUCT_JSON"
          sed -i '' 's/VSCodium/VS Code Egypt/g' "$PRODUCT_JSON"
          sed -i '' 's/vscodium/vscode-egypt/g' "$PRODUCT_JSON"

          APP=$(find vscode-egypt -name "*.app" -type d -maxdepth 3 | head -1)
          if [ -n "$APP" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleName 'VS Code Egypt'" "$APP/Contents/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'VS Code Egypt'" "$APP/Contents/Info.plist" 2>/dev/null || true
          fi

      - name: Create DMG
        run: |
          APP=$(find vscode-egypt -name "*.app" -type d -maxdepth 3 | head -1)
          mkdir -p dmg-root
          cp -R "$APP" dmg-root/
          hdiutil create -volname "VS Code Egypt" -srcfolder dmg-root -ov -format UDZO VS-Code-Egypt.dmg
          ls -lh VS-Code-Egypt.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-DMG
          path: VS-Code-Egypt.dmg

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-Setup-exe }
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-DMG }

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "VS Code Egypt ${{ steps.tag.outputs.TAG }}"
          files: |
            VS-Code-Egypt-Setup.exe
            VS-Code-Egypt.dmg
          body: |
            ## 🏛️ VS Code Egypt ${{ steps.tag.outputs.TAG }}

            ### 📥 التحميل:
            - 🪟 **Windows**: `VS-Code-Egypt-Setup.exe` — معالج تثبيت كامل
            - 🍎 **macOS**: `VS-Code-Egypt.dmg` — اسحب للتطبيقات

            ### ✨ مميزات الـ Installer:
            - معالج تثبيت (Next → Next → Finish)
            - اختصار على سطح المكتب وقائمة ابدأ
            - اختيار مسار التثبيت
            - إلغاء تثبيت من لوحة التحكم

            🤖 Built with Claude Code
          token: ${{ secrets.GITHUB_TOKEN }}
