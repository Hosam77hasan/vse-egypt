name: 🏗️ Build VS Code Egypt (VSCodium rebrand)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    name: 🪟 Windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout config
        uses: actions/checkout@v4
        with:
          path: vse-config

      - name: Download VSCodium
        shell: pwsh
        run: |
          $url = "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-win32-x64-1.126.04524.zip"
          Write-Host "Downloading VSCodium..."
          Invoke-WebRequest -Uri $url -OutFile vscodium.zip
          Write-Host "Extracting..."
          Expand-Archive -Path vscodium.zip -DestinationPath vscode-egypt

      - name: Apply VS Code Egypt branding
        shell: pwsh
        run: |
          $appDir = "vscode-egypt"

          # Replace product.json
          Copy-Item "vse-config/product.json" "$appDir/resources/app/product.json" -Force

          # Replace app name everywhere
          $content = Get-Content "$appDir/resources/app/product.json" -Raw
          $content = $content -replace 'VSCodium', 'VS Code Egypt'
          $content = $content -replace 'vscodium', 'vscode-egypt'
          Set-Content "$appDir/resources/app/product.json" -Value $content

          # Copy our extension AI filter
          New-Item -ItemType Directory -Force -Path "$appDir/resources/app/extensions/vscode-egypt-filter" | Out-Null
          Copy-Item "vse-config/vse-extension/editor/src/browser/extensionAiFilter.js" "$appDir/resources/app/extensions/vscode-egypt-filter/" -Force

          # Copy theme
          if (Test-Path "vse-config/extensions/vscode-egypt-theme") {
            Copy-Item "vse-config/extensions/vscode-egypt-theme" "$appDir/resources/app/extensions/" -Recurse -Force
          }

          # Copy Sphinx logo
          Copy-Item "vse-config/vse-landing/public/assets/sphinx-logo.svg" "$appDir/resources/app/" -Force

          Write-Host "Branding applied successfully"
          Get-ChildItem "$appDir" | Select-Object Name

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "vscode-egypt/*" -DestinationPath "vscode-egypt-windows-x64.zip"
          Write-Host "Package created: vscode-egypt-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-egypt-windows-x64
          path: vscode-egypt-windows-x64.zip
          retention-days: 7

  build-macos:
    name: 🍎 macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout config
        uses: actions/checkout@v4
        with:
          path: vse-config

      - name: Download VSCodium
        run: |
          curl -L -o vscodium.zip "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-darwin-arm64-1.126.04524.zip"
          mkdir -p vscode-egypt
          unzip -q vscodium.zip -d vscode-egypt
          echo "Extracted VSCodium"

      - name: Apply VS Code Egypt branding
        run: |
          # Find the .app bundle
          APP=$(find vscode-egypt -name "*.app" -type d -maxdepth 2 | head -1)
          if [ -z "$APP" ]; then
            echo "Checking directory structure..."
            ls -la vscode-egypt/
            APP="vscode-egypt/VSCodium.app"
          fi
          echo "App bundle: $APP"

          # Replace product.json
          RESOURCES="$APP/Contents/Resources/app"
          if [ -d "$RESOURCES" ]; then
            cp vse-config/product.json "$RESOURCES/product.json"

            # Replace app name
            sed -i '' 's/VSCodium/VS Code Egypt/g' "$RESOURCES/product.json"
            sed -i '' 's/vscodium/vscode-egypt/g' "$RESOURCES/product.json"

            # Copy AI filter
            mkdir -p "$RESOURCES/extensions/vscode-egypt-filter"
            cp vse-config/vse-extension/editor/src/browser/extensionAiFilter.js "$RESOURCES/extensions/vscode-egypt-filter/"

            # Copy logo
            cp vse-config/vse-landing/public/assets/sphinx-logo.svg "$RESOURCES/"

            echo "Branding applied to $RESOURCES"
          else
            echo "ERROR: resources path not found: $RESOURCES"
            find vscode-egypt -name "product.json" 2>/dev/null
          fi

      - name: Package ZIP
        run: |
          zip -r vscode-egypt-macos-arm64.zip vscode-egypt/
          echo "Package created"
          ls -lh vscode-egypt-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-egypt-macos-arm64
          path: vscode-egypt-macos-arm64.zip
          retention-days: 7

  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: success()
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-egypt-windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: vscode-egypt-macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VS Code Egypt ${{ github.ref_name }}"
          body: |
            ## 🏛️ VS Code Egypt ${{ github.ref_name }}

            ### 📥 التحميل:
            - 🪟 **Windows**: `vscode-egypt-windows-x64.zip` — فك الضغط وشغّل `VS Code Egypt.exe`
            - 🍎 **macOS**: `vscode-egypt-macos-arm64.zip` — فك الضغط وشغّل التطبيق

            ### ✨ الميزات:
            - 🤖 3 نماذج AI مدمجة: السائق (Ctrl+K)، القائد، المبتكر
            - 🚫 فلتر ذكي لمنع إضافات AI الخارجية
            - 🎨 تصميم Lime/Chartreuse مصري
            - 💳 دفع يدوي (InstaPay/فودافون كاش/PayPal)
            - 🧩 سوق Open VSX للإضافات العادية

            ### 🔧 تثبيت:
            فك الضغط وشغل البرنامج. مفيش تنصيب — portable.

            🤖 Built with Claude Code
          files: |
            vscode-egypt-windows-x64.zip
            vscode-egypt-macos-arm64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
