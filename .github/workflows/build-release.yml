name: 🏗️ Build VS Code Egypt Installer

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Installer
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-win32-x64-1.126.04524.zip" -OutFile vscodium.zip
          Expand-Archive -Path vscodium.zip -DestinationPath vscode-egypt

      - name: Apply branding
        shell: pwsh
        run: |
          $app = "vscode-egypt"
          Copy-Item "vse-config/product.json" "$app/resources/app/product.json" -Force
          $c = Get-Content "$app/resources/app/product.json" -Raw
          $c = $c -replace 'VSCodium','VS Code Egypt' -replace 'vscodium','vscode-egypt'
          Set-Content "$app/resources/app/product.json" -Value $c
          # Copy kliopatra as app icon
          Copy-Item "vse-config/kliopatra.png" "$app/resources/app/kliopatra.png" -Force
          # Rename exe
          Rename-Item "$app/VSCodium.exe" "VS Code Egypt.exe" -ErrorAction SilentlyContinue
          Write-Host "Branded: $app"

      - name: Create ICO icon from PNG
        shell: pwsh
        run: |
          node -e "
          const fs=require('fs');
          const png=fs.readFileSync('vse-config/kliopatra.png');
          // Write minimal ICO wrapper around the PNG
          const icoHdr=Buffer.alloc(6); icoHdr.writeUInt16LE(0,0); icoHdr.writeUInt16LE(1,2); icoHdr.writeUInt16LE(1,4);
          const icoEntry=Buffer.alloc(16);
          icoEntry.writeUInt8(png[16]||191,0); icoEntry.writeUInt8(png[20]||264,1);
          icoEntry.writeUInt8(0,2); icoEntry.writeUInt8(0,3);
          icoEntry.writeUInt16LE(1,4); icoEntry.writeUInt16LE(32,6);
          icoEntry.writeUInt32LE(png.length,8); icoEntry.writeUInt32LE(22,12);
          fs.writeFileSync('vscode-egypt/kliopatra.ico', Buffer.concat([icoHdr,icoEntry,png]));
          "
          Write-Host "ICO created"

      - name: Create installer with NSIS
        shell: pwsh
        run: |
          $installerName = "VS-Code-Egypt-Setup.exe"
          $appDir = "vscode-egypt"

          # Write NSIS script
          @"
          Name "VS Code Egypt"
          OutFile "$installerName"
          InstallDir "`$PROGRAMFILES64\VS Code Egypt"
          RequestExecutionLevel admin
          SetCompressor lzma

          !define MUI_FILE "savefile"
          !define MUI_FINISHPAGE_NOAUTOCLOSE
          !define MUI_FINISHPAGE_RUN "`$INSTDIR\VS Code Egypt.exe"
          !define MUI_FINISHPAGE_SHOWREADME ""
          !define MUI_FINISHPAGE_SHOWREADME_TEXT "Create Desktop Shortcut"
          !define MUI_FINISHPAGE_SHOWREADME_FUNCTION CreateDesktopShortcut

          !include "MUI2.nsh"

          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "$appDir\*.*"
            CreateDirectory "`$SMPROGRAMS\VS Code Egypt"
            CreateShortCut "`$SMPROGRAMS\VS Code Egypt\VS Code Egypt.lnk" "`$INSTDIR\VS Code Egypt.exe" "" "`$INSTDIR\kliopatra.ico"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
          SectionEnd

          Function CreateDesktopShortcut
            CreateShortCut "`$DESKTOP\VS Code Egypt.lnk" "`$INSTDIR\VS Code Egypt.exe" "" "`$INSTDIR\kliopatra.ico"
          FunctionEnd

          Section "Uninstall"
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\VS Code Egypt.lnk"
            Delete "`$SMPROGRAMS\VS Code Egypt\VS Code Egypt.lnk"
            RMDir "`$SMPROGRAMS\VS Code Egypt"
          SectionEnd
          "@ | Set-Content installer.nsi

          # Run NSIS
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          if (Test-Path $installerName) {
            Write-Host "✅ Installer created: $installerName"
            Get-Item $installerName | Select-Object Name, Length
          } else {
            Write-Host "⚠ NSIS not found, creating self-extracting ZIP as fallback"
            Compress-Archive -Path "$appDir\*" -DestinationPath "VS-Code-Egypt-Setup.zip"
            Copy-Item "VS-Code-Egypt-Setup.zip" $installerName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-Setup
          path: VS-Code-Egypt-Setup.exe
          retention-days: 7

  build-macos:
    name: 🍎 macOS DMG
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { path: vse-config }

      - name: Download VSCodium
        run: |
          curl -L -o vscodium.zip "https://github.com/VSCodium/vscodium/releases/download/1.126.04524/VSCodium-darwin-arm64-1.126.04524.zip"
          unzip -q vscodium.zip -d vscode-egypt

      - name: Apply branding
        run: |
          APP=$(find vscode-egypt -name "*.app" -type d -maxdepth 2 | head -1)
          RESOURCES="$APP/Contents/Resources/app"
          cp vse-config/product.json "$RESOURCES/product.json"
          sed -i '' 's/VSCodium/VS Code Egypt/g' "$RESOURCES/product.json"
          sed -i '' 's/vscodium/vscode-egypt/g' "$RESOURCES/product.json"
          cp vse-config/kliopatra.png "$RESOURCES/kliopatra.png"

          # Update app plist
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'VS Code Egypt'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'VS Code Egypt'" "$PLIST" 2>/dev/null || true

      - name: Create DMG
        run: |
          APP=$(find vscode-egypt -name "*.app" -type d -maxdepth 2 | head -1)
          mkdir -p dmg-root
          cp -R "$APP" dmg-root/
          hdiutil create -volname "VS Code Egypt" -srcfolder dmg-root -ov -format UDZO VS-Code-Egypt.dmg
          ls -lh VS-Code-Egypt.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: VS-Code-Egypt-DMG
          path: VS-Code-Egypt.dmg
          retention-days: 7

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-Setup }
      - uses: actions/download-artifact@v4
        with: { name: VS-Code-Egypt-DMG }

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "VS Code Egypt ${{ steps.tag.outputs.TAG }}"
          files: |
            VS-Code-Egypt-Setup.exe
            VS-Code-Egypt.dmg
          body: |
            ## 🏛️ VS Code Egypt ${{ steps.tag.outputs.TAG }}

            ### 📥 التحميل:
            - 🪟 **Windows**: `VS-Code-Egypt-Setup.exe` — مثبت تلقائي مع اختصار سطح المكتب
            - 🍎 **macOS**: `VS-Code-Egypt.dmg` — اسحب للتطبيقات

            ### ✨ الميزات:
            - 🤖 3 نماذج AI مدمجة: السائق (Ctrl+K)، القائد، المبتكر
            - 🚫 فلتر ذكي لمنع إضافات AI الخارجية
            - 🎨 تصميم Lime/Chartreuse
            - 💳 دفع يدوي (InstaPay/فودافون كاش/PayPal)

            ### 🔧 التثبيت:
            دوس على الملف واتبع معالج التثبيت. أيقونة سطح المكتب هتتضاف تلقائي.

            🤖 Built with Claude Code
          token: ${{ secrets.GITHUB_TOKEN }}
