name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies (landing)
        working-directory: ./vse-landing
        run: npm ci

      - name: 📦 Install dependencies (payment-portal)
        working-directory: ./vse-payment-portal
        run: npm ci

      - name: 🔨 Build landing page
        working-directory: ./vse-landing
        run: npm run build || echo "No build script, using static files"

      - name: 📁 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './vse-landing/public'

  # Deploy to GitHub Pages
  deploy:
    name: 🚀 Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify on success
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    
    steps:
      - name: 📧 Send notification
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Site is live at: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          
      - name: 💬 Post comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Deployment Successful!**\n\nThe changes have been deployed to GitHub Pages.\n\n[View Live Site](${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)'
            })