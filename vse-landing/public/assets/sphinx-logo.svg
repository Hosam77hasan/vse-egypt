<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="sky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="sand" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#c49630"/>
    </linearGradient>
    <linearGradient id="pyramid1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d4a832"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="pyramid2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c99e2e"/>
      <stop offset="100%" stop-color="#a67c00"/>
    </linearGradient>
    <linearGradient id="pyramid3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#bf9428"/>
      <stop offset="100%" stop-color="#967200"/>
    </linearGradient>
    <linearGradient id="sphinxBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#dab840"/>
      <stop offset="100%" stop-color="#b89028"/>
    </linearGradient>
    <linearGradient id="limeAccent" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b5e000"/>
      <stop offset="100%" stop-color="#8fb300"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="200" height="200" rx="24" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="30" cy="25" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="170" cy="20" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="35" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="55" cy="40" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="180" cy="50" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="20" cy="55" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="90" cy="15" r="1" fill="#fff" opacity="0.6"/>

  <!-- Moon -->
  <circle cx="160" cy="30" r="14" fill="#f5e6b8" opacity="0.9"/>
  <circle cx="165" cy="27" r="12" fill="url(#sky)"/>

  <!-- Ground / Sand -->
  <ellipse cx="100" cy="175" rx="95" ry="30" fill="url(#sand)"/>
  <rect x="5" y="165" width="190" height="40" fill="url(#sand)"/>

  <!-- Pyramids -->
  <!-- Far pyramid (smallest) -->
  <polygon points="155,75 175,160 135,160" fill="url(#pyramid3)" opacity="0.7"/>

  <!-- Middle pyramid -->
  <polygon points="30,55 65,160 5,160" fill="url(#pyramid2)" opacity="0.8"/>

  <!-- Main/Great Pyramid -->
  <polygon points="125,45 165,160 85,160" fill="url(#pyramid1)"/>

  <!-- Pyramid highlight edges -->
  <line x1="125" y1="45" x2="165" y2="160" stroke="#e8d070" stroke-width="0.5" opacity="0.5"/>
  <line x1="30" y1="55" x2="65" y2="160" stroke="#e8d070" stroke-width="0.5" opacity="0.4"/>

  <!-- Sphinx Body -->
  <ellipse cx="72" cy="153" rx="30" ry="12" fill="url(#sphinxBody)"/>

  <!-- Sphinx chest rising -->
  <ellipse cx="68" cy="140" rx="18" ry="16" fill="url(#sphinxBody)"/>

  <!-- Sphinx paws -->
  <ellipse cx="48" cy="156" rx="10" ry="4" fill="#c9a030"/>
  <ellipse cx="88" cy="156" rx="8" ry="4" fill="#c9a030"/>

  <!-- Sphinx head -->
  <ellipse cx="65" cy="118" rx="12" ry="14" fill="url(#sphinxBody)"/>

  <!-- Nemes (headdress) -->
  <path d="M48 108 L55 88 L65 84 L75 88 L82 108 L82 118 L48 118 Z" fill="#1e1e1e"/>

  <!-- Nemes stripes -->
  <line x1="52" y1="92" x2="78" y2="92" stroke="#aacc00" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="98" x2="80" y2="98" stroke="#aacc00" stroke-width="1" opacity="0.5"/>
  <line x1="49" y1="104" x2="81" y2="104" stroke="#aacc00" stroke-width="1" opacity="0.5"/>
  <line x1="48" y1="110" x2="82" y2="110" stroke="#aacc00" stroke-width="1" opacity="0.5"/>

  <!-- Face -->
  <ellipse cx="65" cy="114" rx="8" ry="10" fill="#2a2a2a"/>

  <!-- Eyes (glowing lime) -->
  <ellipse cx="61" cy="110" rx="2.5" ry="3" fill="#aacc00"/>
  <ellipse cx="69" cy="110" rx="2.5" ry="3" fill="#aacc00"/>
  <ellipse cx="61.5" cy="109" rx="1" ry="1.5" fill="#b5e000"/>
  <ellipse cx="69.5" cy="109" rx="1" ry="1.5" fill="#b5e000"/>

  <!-- Nose -->
  <ellipse cx="65" cy="115" rx="2" ry="1.5" fill="#444"/>

  <!-- Mouth -->
  <path d="M59 118 Q65 122 71 118" stroke="#444" stroke-width="1" fill="none"/>

  <!-- Beard -->
  <rect x="63" y="122" width="4" height="8" rx="1.5" fill="#333"/>

  <!-- Uraeus (cobra) -->
  <ellipse cx="65" cy="82" rx="3" ry="5" fill="#aacc00"/>
  <circle cx="65" cy="78" r="2" fill="#b5e000"/>

  <!-- Lime accent line at bottom -->
  <rect x="5" y="188" width="190" height="3" rx="1.5" fill="url(#limeAccent)"/>

  <!-- VS Code Egypt text at bottom -->
  <text x="100" y="198" text-anchor="middle" font-family="Cairo,sans-serif" font-size="8" font-weight="700" fill="#aacc00">VS CODE EGYPT</text>
</svg>
