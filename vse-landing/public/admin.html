<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>لوحة التحكم — VS Code Egypt</title>
<link rel="stylesheet" href="admin-style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#aacc00" />
</head>
<body>

  <div id="loginGate" class="login-gate" hidden>
    <div>
      <p style="font-size:18px; margin-bottom:8px;">🔒 مفيش جلسة دخول صالحة.</p>
      <p style="font-size:13px; opacity:0.8;">ارجع للصفحة الرئيسية واضغط مطولاً على الأيقونة في الأسفل للدخول.</p>
    </div>
  </div>

  <div id="dashboard" hidden>
    <header class="admin-topbar">
      <h1>🏛️ طلبات الشحن</h1>
      <button id="logoutBtn">خروج</button>
    </header>

    <div id="pushBanner" class="push-banner" hidden>
      <span>🔔 فعّل الإشعارات عشان توصلك أول ما يجي طلب جديد — حتى والمتصفح مقفول</span>
      <button id="enablePushBtn">تفعيل</button>
    </div>

    <div class="status-tabs">
      <button class="status-tab active" data-status="pending">⏳ قيد المراجعة</button>
      <button class="status-tab" data-status="approved">✅ تمت الموافقة</button>
      <button class="status-tab" data-status="rejected">❌ مرفوضة</button>
    </div>

    <div id="listContainer" class="request-list">
      <div class="loading-state">جاري التحميل…</div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
