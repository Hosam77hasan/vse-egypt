<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b5e000"/>
      <stop offset="100%" stop-color="#8fb300"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>

  <!-- Base / Platform -->
  <rect x="30" y="180" width="140" height="14" rx="7" fill="url(#bodyGrad)"/>

  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="30" fill="url(#bodyGrad)"/>

  <!-- Left paw -->
  <ellipse cx="52" cy="140" rx="14" ry="8" fill="#aacc00"/>

  <!-- Right paw -->
  <ellipse cx="148" cy="140" rx="14" ry="8" fill="#aacc00"/>

  <!-- Chest / neck -->
  <ellipse cx="100" cy="110" rx="30" ry="25" fill="url(#bodyGrad)"/>

  <!-- Nemes (headdress) -->
  <path d="M45 85 L55 20 L100 15 L145 20 L155 85 L155 100 L45 100 Z" fill="url(#darkGrad)"/>

  <!-- Nemes stripes -->
  <path d="M55 25 L100 18 L145 25" stroke="#aacc00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M52 40 L100 28 L148 40" stroke="#aacc00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M48 55 L100 38 L152 55" stroke="#aacc00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M46 70 L100 48 L154 70" stroke="#aacc00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M45 85 L100 58 L155 85" stroke="#aacc00" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Face -->
  <ellipse cx="100" cy="95" rx="22" ry="28" fill="#1e1e1e"/>

  <!-- Eyes -->
  <ellipse cx="90" cy="88" rx="5" ry="6" fill="#aacc00"/>
  <ellipse cx="110" cy="88" rx="5" ry="6" fill="#aacc00"/>

  <!-- Eye glow -->
  <ellipse cx="91" cy="87" rx="2" ry="2.5" fill="#b5e000"/>
  <ellipse cx="111" cy="87" rx="2" ry="2.5" fill="#b5e000"/>

  <!-- Nose -->
  <ellipse cx="100" cy="97" rx="3" ry="2" fill="#333"/>

  <!-- Mouth line -->
  <path d="M92 102 Q100 108 108 102" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Beard -->
  <rect x="96" y="108" width="8" height="14" rx="2" fill="#222"/>

  <!-- Uraeus (cobra on forehead) -->
  <ellipse cx="100" cy="58" rx="3" ry="5" fill="#aacc00"/>
  <circle cx="100" cy="53" r="2.5" fill="#b5e000"/>

</svg>
