<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فاتورتك — VS Code Egypt</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  .billing-wrap { max-width: 620px; margin: 0 auto; padding: 48px 24px; }
  .billing-card { background: var(--gray); border: 2px solid var(--lime-dark); border-radius: 10px; padding: 28px; margin-bottom: 20px; }
  .billing-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .plan-pill { display: inline-block; padding: 4px 14px; border-radius: 14px; background: var(--lime); color: var(--black); font-weight: 700; font-size: 13px; }
  .usage-bar-track { width: 100%; height: 10px; background: #0a0a0a; border-radius: 6px; overflow: hidden; margin: 10px 0; }
  .usage-bar-fill { height: 100%; background: var(--lime); transition: width 0.3s ease; }
  .usage-bar-fill.warn { background: #ffb020; }
  .usage-bar-fill.danger { background: #ff5555; }
  .model-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 13px; color: #ccc; }
  .model-row:last-child { border-bottom: none; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .pay-btn { flex: 1; margin-top: 0; }
  #loadingState, #errorState { text-align: center; padding: 60px 20px; color: var(--lime-dark); }
  #errorState { display: none; color: #ff6b6b; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">VS Code <span>مصر</span></div>
    <nav class="top-nav">
      <a href="/support.html">مساعدة</a>
    </nav>
  </header>

  <main class="billing-wrap">
    <div id="loadingState">جاري تحميل بيانات الحساب…</div>
    <div id="errorState"></div>

    <div id="content" hidden>
      <div class="billing-card">
        <div class="billing-row">
          <span id="emailLabel"></span>
          <span class="plan-pill" id="planPill"></span>
        </div>
        <div id="subscriptionInfo" class="billing-row" style="font-size:12px; color:#888;"></div>
      </div>

      <div class="billing-card">
        <h2 style="margin:0 0 8px; font-size:16px;">استهلاك التوكنز هذا الشهر</h2>
        <div class="usage-bar-track"><div class="usage-bar-fill" id="usageBarFill"></div></div>
        <div class="billing-row" style="font-size:13px; color:#ccc;">
          <span id="usageNumbers"></span>
          <span id="usagePercent"></span>
        </div>

        <div id="modelBreakdown" style="margin-top:16px;"></div>
      </div>

      <div class="billing-card">
        <div class="actions">
          <a href="#" class="pay-btn" id="upgradeBtn">ترقية الباقة</a>
          <a href="#" class="pay-btn" id="renewBtn" style="background:#1a1a1a; color:var(--lime); border:1px solid var(--lime);">تجديد الاشتراك</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/billing.js"></script>
</body>
</html>
