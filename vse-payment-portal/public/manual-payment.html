<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>اشحن رصيدك يدويًا — VS Code Egypt</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  .pay-wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px 60px; }
  .pay-intro { color: #ccc; font-size: 14px; line-height: 1.8; margin-bottom: 24px; }
  .channel-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .channel-tab { flex: 1; min-width: 120px; padding: 10px; border: 1px solid var(--lime-dark); border-radius: 8px; background: transparent; color: var(--lime-dark); font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
  .channel-tab.active { background: var(--lime); color: var(--black); border-color: var(--lime); }
  .channel-card { background: var(--gray); border: 2px solid var(--lime-dark); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .channel-card h3 { margin: 0 0 10px; font-size: 15px; }
  .channel-detail { display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .channel-detail button { background: none; border: 1px solid var(--lime-dark); color: var(--lime); border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  form.pay-form { display: flex; flex-direction: column; gap: 12px; }
  .pay-form label { font-size: 13px; color: #ccc; }
  .pay-form input, .pay-form select, .pay-form textarea { width: 100%; padding: 11px 12px; border-radius: 7px; border: 1px solid #333; background: #0a0a0a; color: var(--lime); font-family: inherit; font-size: 14px; }
  .pay-form textarea { resize: vertical; min-height: 60px; }
  .amount-row { display: flex; gap: 10px; }
  .amount-row > div { flex: 1; }
  #submitBtn { margin-top: 6px; }
  #resultBox { display: none; text-align: center; padding: 40px 20px; }
  #resultBox.show { display: block; }
  #resultBox.error { color: #ff6b6b; }
  .pending-note { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.7; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">VS Code <span>مصر</span></div>
    <nav class="top-nav">
      <a href="/support.html">مساعدة</a>
    </nav>
  </header>

  <main class="pay-wrap">
    <h1>اشحن رصيدك يدويًا</h1>
    <p class="pay-intro">
      حوّل المبلغ على أي وسيلة من اللي تحت، وبعدين اكتب رقم/مرجع العملية هنا.
      فريقنا هيراجع الطلب ويشحن رصيدك بمجرد التأكد من التحويل — عادة خلال دقايق.
    </p>

    <div id="formView">
      <div class="channel-tabs" id="channelTabs">
        <button type="button" class="channel-tab active" data-method="instapay">InstaPay</button>
        <button type="button" class="channel-tab" data-method="vodafone_cash">فودافون كاش</button>
        <button type="button" class="channel-tab" data-method="paypal">PayPal</button>
        <button type="button" class="channel-tab" data-method="crypto">USDT (TRC20)</button>
      </div>

      <div class="channel-card" id="channelDetails"></div>

      <form class="pay-form" id="payForm">
        <div>
          <label for="email">إيميل حسابك في VS Code Egypt</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <div class="amount-row">
          <div>
            <label for="amount">المبلغ</label>
            <input type="number" id="amount" min="1" step="0.01" required placeholder="100" />
          </div>
          <div>
            <label for="currency">العملة</label>
            <select id="currency">
              <option value="EGP">EGP</option>
              <option value="USD">USD</option>
            </select>
          </div>
        </div>

        <div>
          <label for="transactionRef" id="transactionRefLabel">رقم مرجع العملية / رقم الموبايل</label>
          <input type="text" id="transactionRef" required placeholder="مثال: 123456789" />
        </div>

        <div>
          <label for="notes">ملاحظات (اختياري)</label>
          <textarea id="notes" maxlength="500" placeholder="أي تفاصيل إضافية تساعد في المراجعة"></textarea>
        </div>

        <button type="submit" class="pay-btn" id="submitBtn">إرسال الطلب</button>
        <p class="pending-note">الطلب هيفضل "قيد المراجعة" لحد ما فريقنا يتأكد من التحويل ويوافق عليه — مش هيتشحن رصيدك أوتوماتيك.</p>
      </form>
    </div>

    <div id="resultBox"></div>
  </main>

  <script src="/manual-payment.js"></script>
</body>
</html>
